# Test-safe SMS settings: always simulate and avoid real provider calls.
app.sms.enabled=true
app.sms.simulate=true
app.sms.default-country-code=91

# Fast2SMS settings remain env-backed; tests run in simulate mode.
fast2sms.api.key=${FAST2SMS_API_KEY:}
fast2sms.url=${FAST2SMS_URL:https://www.fast2sms.com/dev/bulkV2}
