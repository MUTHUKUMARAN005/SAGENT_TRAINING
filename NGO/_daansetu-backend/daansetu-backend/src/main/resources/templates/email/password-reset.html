<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div style="font-family:'Segoe UI',Arial,sans-serif;max-width:600px;margin:0 auto;background:#0f172a;border-radius:16px;overflow:hidden;">
    <div style="background:linear-gradient(135deg,#dc2626,#ef4444);padding:40px 30px;text-align:center;">
        <h1 style="color:#fff;margin:0;font-size:28px;">🔑 Password Reset</h1>
    </div>
    <div style="padding:30px;">
        <h2 style="color:#e2e8f0;" th:text="'Hi ' + ${userName} + ','">Hi User,</h2>
        <p style="color:#94a3b8;">We received a request to reset your password. Use the OTP below:</p>
        <div style="text-align:center;margin:25px 0;padding:20px;background:#1e293b;border-radius:12px;">
            <p style="color:#94a3b8;margin:0 0 8px;font-size:13px;">Your OTP Code</p>
            <h1 style="color:#3b82f6;margin:0;font-size:36px;letter-spacing:8px;font-family:monospace;" th:text="${otp}">123456</h1>
            <p style="color:#64748b;margin:8px 0 0;font-size:12px;">Valid for 30 minutes</p>
        </div>
        <div style="text-align:center;margin:20px 0;">
            <a th:href="${resetUrl}" style="display:inline-block;background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;text-decoration:none;padding:12px 35px;border-radius:12px;font-weight:600;">
                Reset Password
            </a>
        </div>
    </div>
</div>
</body>
</html>
