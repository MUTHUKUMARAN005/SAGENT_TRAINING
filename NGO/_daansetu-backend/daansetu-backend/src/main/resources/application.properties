# ============================================
# DAANSETU - APPLICATION CONFIGURATION
# Java 21 + Spring Boot 3.3.5
# ============================================

# ============================================
# SERVER CONFIGURATION
# ============================================
server.port=8080
server.servlet.context-path=/api
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.whitelabel.enabled=false
server.error.path=/error
server.compression.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ============================================
# APPLICATION INFO
# ============================================
spring.application.name=daansetu-backend
app.name=DaanSetu
app.version=1.0.0
app.description=Transparent Donation Platform

# ============================================
# =============================================
# MySQL Workbench Connection
# Since tables/data already created manually
# =============================================

# YOUR MySQL connection (change password if different)
spring.datasource.url=jdbc:mysql://localhost:3306/daansetu_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=1234

# IMPORTANT: Use 'validate' since tables already exist


# Rest of properties remain same...

# HikariCP Connection Pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.pool-name=DaanSetuHikariPool

# ============================================
# JPA / HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# ============================================
# SQL INITIALIZATION (FIXED)
# ============================================
spring.sql.init.mode=never

# ============================================
# JAVA 21
# ============================================
spring.threads.virtual.enabled=true

# ============================================
# JACKSON JSON CONFIG
# ============================================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata

