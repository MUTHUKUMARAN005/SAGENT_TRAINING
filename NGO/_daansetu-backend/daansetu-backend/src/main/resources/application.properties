# ============================================
# WEBSOCKET CONFIGURATION
# ============================================

app.websocket.enabled=true
app.websocket.endpoint=/ws
app.websocket.allowed-origins=http://localhost:3000,http://localhost:5173
app.websocket.topic.notifications=/topic/notifications
app.websocket.topic.donations=/topic/donations
app.websocket.topic.stats=/topic/stats
# ============================================
# FILE UPLOAD
# ============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

file.upload-dir=./uploads
file.max-size=10485760

# ============================================
# CORS CONFIGURATION
# ============================================
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
app.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true

# ============================================
# FRONTEND URLs
# ============================================
app.frontend-url=http://localhost:5173
app.backend-url=http://localhost:8080/api

# ============================================
# OTP CONFIGURATION
# ============================================
app.otp.expiry-minutes=10
app.otp.length=6
app.otp.max-attempts=3

# ============================================
# SMS CONFIGURATION (FAST2SMS)
# ============================================
app.sms.enabled=true
app.sms.simulate=false
# Keep false for strict real OTP delivery.
app.sms.fallback-to-simulate=false
app.sms.default-country-code=91
fast2sms.api.key=BJGoPMwUcVl0Mr879P7f9Hs7qzZkCgmUEzfJEFDuHrI8NYo3sZnWe4tAZKuC
fast2sms.url=https://www.fast2sms.com/dev/bulkV2

# ============================================
# SWAGGER
# ============================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# ============================================
# ACTUATOR
# ============================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
# Disable mail health check - prevents SMTP connect timeout on every health poll
management.health.mail.enabled=false

# ============================================
# LOGGING
# ============================================
logging.level.root=INFO
logging.level.com.daansetu=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# ============================================
# CACHE
# ============================================
spring.cache.type=simple

# ============================================
# STATIC RESOURCES
# ============================================
spring.web.resources.static-locations=classpath:/static/,classpath:/public/

# ============================================
# DEVTOOLS
# ============================================
spring.devtools.restart.enabled=true

# ============================================
# PROFILE
# ============================================
spring.profiles.active=dev
app.security.print-bcrypt-samples=false
app.seed.sample-data=true
